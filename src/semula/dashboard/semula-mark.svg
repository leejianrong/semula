  <path class="ink" d="M32 11A21 21 0 1 1 11 32" fill="none" stroke-width="6.5" stroke-linecap="round"/>
  <path class="ink fill" d="M11 22L4 33H18z" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="32" cy="11" r="8.5" fill="#C8271F"/>
</svg>
