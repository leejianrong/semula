name: Release

# Pushing vX.Y.Z publishes a GitHub Release and the container image (docs/RELEASING.md).
# A dry run (Actions > Release > Run workflow, or a pull request that touches the release
# machinery) builds and smoke-tests everything and publishes nothing.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Dockerfile
      - scripts/release.py
      - scripts/smoke_image.sh
      - scripts/smoke_image_hosted.sh
      - scripts/build_cli_binary.sh
      - scripts/smoke_cli_binary.sh
      - scripts/cli_entry.py
      - src/semula/cli.py

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a publish half way

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # to read the CI run of this commit
    outputs:
      tag: ${{ steps.what.outputs.tag }}
      version: ${{ steps.flags.outputs.version }}
      prerelease: ${{ steps.flags.outputs.prerelease }}
      latest: ${{ steps.flags.outputs.latest }}
      publish: ${{ steps.what.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: what
        name: Which tag, and are we publishing?
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: The tagged commit is on main
        if: steps.what.outputs.publish == 'true'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main; release from the merge commit"; exit 1; }
      - name: CI passed on this exact commit
        if: steps.what.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          green=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push \
            --json conclusion,headBranch \
            -q '[.[] | select(.conclusion == "success" and .headBranch == "main")] | length')
          [ "${green:-0}" -ge 1 ] \
            || { echo "::error::no green CI run on main for $GITHUB_SHA"; exit 1; }
      - name: Tag, pyproject.toml, uv.lock and CHANGELOG agree
        if: steps.what.outputs.publish == 'true'
        run: python3 scripts/release.py check "${{ steps.what.outputs.tag }}"
      - id: flags
        run: python3 scripts/release.py flags "${{ steps.what.outputs.tag }}" >> "$GITHUB_OUTPUT"

  # The CLI alone as one file per platform. Linux is built on the oldest Ubuntu runner so the
  # binary runs on older glibc. Each binary is smoke-tested against a server before it is kept.
  binaries:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-amd64, os: ubuntu-22.04 }
          - { target: linux-arm64, os: ubuntu-22.04-arm }
          - { target: macos-arm64, os: macos-15 }
          - { target: macos-amd64, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --frozen --no-dev
      - name: Build
        run: scripts/build_cli_binary.sh dist
      - name: Smoke test against a running server
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          SEMULA_DATA_DIR="$RUNNER_TEMP/data" SEMULA_PORT=18080 uv run semula serve &
          server=$!
          trap 'kill $server' EXIT
          for _ in $(seq 1 100); do curl -fs http://127.0.0.1:18080/health >/dev/null && break; sleep 0.3; done
          scripts/smoke_cli_binary.sh dist/semula http://127.0.0.1:18080 "$VERSION"
      - name: Name it and checksum it
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mv dist/semula "dist/semula-$VERSION-${{ matrix.target }}"
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "semula-$VERSION-${{ matrix.target }}" > "semula-$VERSION-${{ matrix.target }}.sha256"
          else shasum -a 256 "semula-$VERSION-${{ matrix.target }}" > "semula-$VERSION-${{ matrix.target }}.sha256"; fi
          cat "semula-$VERSION-${{ matrix.target }}.sha256"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: dist/semula-*
          if-no-files-found: error

  release:
    # Only when every binary built and passed its smoke test: no release without them.
    needs: [verify, binaries]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: cli-*
          path: binaries
          merge-multiple: true
      - name: All four binaries are here
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          for t in linux-amd64 linux-arm64 macos-arm64 macos-amd64; do
            [ -s "binaries/semula-$VERSION-$t" ] || { echo "::error::missing binary for $t"; exit 1; }
            [ -s "binaries/semula-$VERSION-$t.sha256" ] || { echo "::error::missing checksum for $t"; exit 1; }
          done
          (cd binaries && cat semula-*.sha256 > SHA256SUMS && sha256sum -c SHA256SUMS)
          rm binaries/*.sha256
          chmod +x binaries/semula-*
          ls -l binaries
      - name: Create the GitHub Release from the CHANGELOG, with the binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; making sure the binaries are attached."
            gh release upload "$TAG" binaries/* --clobber
            exit 0
          fi
          python3 scripts/release.py notes "$TAG" > notes.md
          flag=""
          [ "$PRERELEASE" = true ] && flag="--prerelease"
          gh release create "$TAG" --verify-tag --title "semula $VERSION" --notes-file notes.md $flag binaries/*

  image:
    needs: verify
    runs-on: ubuntu-latest
    # Two images from one Dockerfile: the default (local use, small) and `-hosted`, which adds
    # the sign-in and Postgres drivers a hosted server needs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            suffix: ""
            extras: ""
            smoke: scripts/smoke_image.sh
          - variant: hosted
            suffix: "-hosted"
            extras: "--extra hosted --extra postgres"
            smoke: scripts/smoke_image_hosted.sh
    permissions:
      contents: read
      packages: write # push to ghcr.io
    env:
      PUBLISH: ${{ needs.verify.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4.4.0
        if: env.PUBLISH == 'true'
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }}
            type=raw,value=${{ needs.verify.outputs.version }}-dev,enable=${{ env.PUBLISH != 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.verify.outputs.version }}
            type=raw,value=latest,enable=${{ env.PUBLISH == 'true' && needs.verify.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.title=semula
            org.opencontainers.image.description=A record-replay fake OpenAI-compatible server for development and tests
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
      # Published: both architectures, pushed. Dry run: this runner's architecture, kept local.
      - id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH == 'true' }}
          load: ${{ env.PUBLISH != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: UV_EXTRAS=${{ matrix.extras }}
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
      - name: Smoke test the image users will pull
        run: |
          if [ "$PUBLISH" = true ]; then
            docker pull "${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}"
            ${{ matrix.smoke }} "${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}"
          else
            ${{ matrix.smoke }} "${{ steps.name.outputs.image }}:${{ needs.verify.outputs.version }}-dev${{ matrix.suffix }}"
          fi
      - name: What was published
        if: env.PUBLISH == 'true'
        run: |
          {
            echo "### Image (${{ matrix.variant }})"
            echo '```'
            echo "docker pull ${{ steps.name.outputs.image }}:${{ needs.verify.outputs.version }}${{ matrix.suffix }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
