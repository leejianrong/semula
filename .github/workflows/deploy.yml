name: Deploy

# Puts a released version on the droplet. A release calls this after the image is published
# (release.yml); Actions > Deploy > Run workflow redeploys or rolls back to any released version.
# Both wait for you to approve the `production` environment.
on:
  workflow_call:
    inputs:
      version:
        description: X.Y.Z
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Released version to run (X.Y.Z)
        type: string
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false # never cut a deploy off half way

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      VERSION: ${{ inputs.version }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Check the version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must be X.Y.Z" >&2; exit 2; }
      - name: Connect settings
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s %s\n' "$DEPLOY_HOST" "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o BatchMode=yes "deploy@${DEPLOY_HOST}" "$VERSION"
      - name: Check the site from here
        run: curl -fsS --retry 5 --retry-delay 5 "https://${{ vars.DEPLOY_DOMAIN }}/health"
