name: Deploy

# Redeploys, or rolls back to, a released version: Actions > Deploy > Run workflow. (A release
# deploys itself from release.yml.) It waits for you to approve the `production` environment.
# This is not a reusable workflow on purpose: a called workflow cannot see its job's
# environment secrets, so both ways in run the same action from a job of their own.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Released version to run (X.Y.Z)
        type: string
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false # never cut a deploy off half way

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/deploy
        with:
          version: ${{ inputs.version }}
          host: ${{ secrets.DEPLOY_HOST }}
          host-key: ${{ secrets.DEPLOY_HOST_KEY }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          domain: ${{ vars.DEPLOY_DOMAIN }}
