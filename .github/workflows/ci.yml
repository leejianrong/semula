name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run mypy

  # Fast layer: unit + integration. No external infra; mirrors the pre-push hook.
  fast-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -m "unit or integration" -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run pip-audit

  # The same suites on Postgres (ADR-0009). Each test gets a private schema.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: semula
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d semula"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SEMULA_TEST_DATABASE_URL: postgresql://postgres:pw@localhost:5432/semula
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra e2e
      - run: uv run pytest -m "unit or integration or e2e" -q

  # Budgets: replay latency on a 1k-entry project, and the container image (size, cold start,
  # non-root, data on /data). Failing either fails CI.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -m perf -s -q

  # Optional semantic matching with the real model: paraphrase, offline load, latency budget,
  # and the embeddings image (model fetched once, then starts with no network).
  embeddings:
    runs-on: ubuntu-latest
    env:
      SEMULA_TEST_MODEL_DIR: ${{ github.workspace }}/.models
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: .models
          key: embedding-model-bge-small-en-v1.5
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra embeddings
      - run: uv run pytest -m embeddings -s -q
      - run: scripts/check_embeddings_image.sh semula:embeddings-ci

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check_image.sh semula:ci

  # The public deployment (deploy/droplet): the whole compose stack, behind Caddy, on Postgres with
  # a non-owner role, checked by scripts/smoke_droplet.sh.
  droplet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --build-arg UV_EXTRAS="--extra hosted --extra postgres" -t semula:droplet-ci .
      - run: scripts/smoke_droplet.sh semula:droplet-ci

  # Stored text must never run in another person's dashboard: the real dashboard in Chromium and
  # Firefox (tests/browser).
  browser:
    runs-on: ubuntu-latest
    env:
      SEMULA_BROWSERS: chromium,firefox
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run --with playwright==1.64.1 playwright install --with-deps chromium firefox
      - run: uv run --with playwright==1.64.1 pytest -m browser -q

  # Heavy layer: the real app over loopback driven by the OpenAI SDK, network blocked.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra e2e
      - run: uv run pytest -m e2e -q

  # The documentation site must build (broken links, bad nav, a diagram that will not parse fail
  # here, before merge). The deploy is .github/workflows/docs.yml, on main only.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: make docs
