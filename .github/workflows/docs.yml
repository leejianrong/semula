name: Docs

# Publish the documentation site to GitHub Pages when main changes. Pull requests are checked
# by the `docs` job in ci.yml; nothing here runs for them.
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - zensical.toml
      - Makefile
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/configure-pages@v6.0.0
      - run: make docs
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
