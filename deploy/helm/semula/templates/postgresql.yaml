{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "semula.fullname" . }}-postgresql
  labels: {{- include "semula.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
  selector:
    {{- include "semula.postgresSelectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "semula.fullname" . }}-postgresql
  labels: {{- include "semula.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "semula.fullname" . }}-postgresql
  replicas: 1
  selector:
    matchLabels:
      {{- include "semula.postgresSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "semula.postgresSelectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70 # postgres in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - {name: POSTGRES_USER, value: semula}
            - {name: POSTGRES_DB, value: semula}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "semula.dbSecretName" . }}
                  key: postgres-password
          readinessProbe:
            exec: {command: [pg_isready, -h, 127.0.0.1, -U, semula, -d, semula]}
            periodSeconds: 5
          resources: {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - {name: run, emptyDir: {}}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {{- include "semula.postgresSelectorLabels" . | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgresql.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
{{- end }}
