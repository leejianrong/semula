{{- if and (not .Values.auth.disabled) (not .Values.auth.existingSecret) }}
{{- /* Keep the key a previous install made; generate one only the first time. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "semula.authSecretName" .) }}
{{- $key := .Values.auth.apiKey }}
{{- if and (not $key) $existing }}{{ $key = index $existing.data "api-key" | b64dec }}{{ end }}
{{- if not $key }}{{ $key = randAlphaNum 48 }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "semula.authSecretName" . }}
  labels: {{- include "semula.labels" . | nindent 4 }}
type: Opaque
data:
  api-key: {{ $key | b64enc | quote }}
{{- end }}
{{- if or .Values.postgresql.enabled (and .Values.externalDatabase.url (not .Values.externalDatabase.existingSecret)) }}
---
{{- $dbSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-db" (include "semula.fullname" .)) }}
{{- $password := "" }}
{{- if $dbSecret }}{{ $password = index $dbSecret.data "postgres-password" | b64dec }}{{ end }}
{{- if not $password }}{{ $password = randAlphaNum 32 }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-db" (include "semula.fullname" .) }}
  labels: {{- include "semula.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.postgresql.enabled }}
  postgres-password: {{ $password | b64enc | quote }}
  database-url: {{ printf "postgresql://semula:%s@%s-postgresql:5432/semula" $password (include "semula.fullname" .) | b64enc | quote }}
  {{- else }}
  database-url: {{ .Values.externalDatabase.url | b64enc | quote }}
  {{- end }}
{{- end }}
