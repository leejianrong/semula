# semula, hosted, on one droplet: Caddy (TLS) -> semula -> Postgres, plus a nightly purge.
#
#   cp .env.example .env && edit it          secrets and your domain (never commit .env)
#   docker compose up -d --wait              start everything (migrates first)
#   docker compose run --rm admin workspace-create acme --name Acme     operator commands
#
# Only Caddy publishes ports (80 and 443). The database has no published port. The app runs as a
# Postgres role that does not own the tables, so row-level security applies to it; migrations,
# the purge and `admin` run as the owner (docs/guide/hosted.md, "Postgres and roles").
name: semula-hosted

x-image: &image ${SEMULA_IMAGE:-ghcr.io/leejianrong/semula:latest-hosted}

x-owner-url: &owner_url
  SEMULA_DATABASE_URL: postgresql://semula_owner:${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD in .env}@db:5432/semula
x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    <<: *hardening
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID] # what the image's entrypoint needs
    environment:
      POSTGRES_USER: semula_owner # owns the tables; migrations and the purge connect as this
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD in .env}
      POSTGRES_DB: semula
      SEMULA_DB_PASSWORD: ${SEMULA_DB_PASSWORD:?set SEMULA_DB_PASSWORD in .env} # for initdb/01-roles.sh
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U semula_owner -d semula"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  migrate: # runs once per `up`, before the app; the app refuses to start on an old schema
    image: *image
    <<: *hardening
    restart: "no"
    command: ["semula", "admin", "migrate"]
    environment:
      SEMULA_HOSTED: "on"
      <<: *owner_url
    depends_on:
      db: {condition: service_healthy}
    mem_limit: 256m

  semula:
    image: *image
    restart: unless-stopped
    <<: *hardening
    environment:
      SEMULA_HOSTED: "on"
      SEMULA_MIGRATE: "off"
      SEMULA_DATABASE_URL: postgresql://semula:${SEMULA_DB_PASSWORD:?set SEMULA_DB_PASSWORD in .env}@db:5432/semula
      SEMULA_PUBLIC_URL: https://${SEMULA_DOMAIN:?set SEMULA_DOMAIN in .env}
      SEMULA_SECRET: ${SEMULA_SECRET:?set SEMULA_SECRET in .env}
      SEMULA_TRUSTED_PROXIES: 172.30.0.2 # Caddy's fixed address, and nothing else on the network
      SEMULA_AUTH_PROVIDERS: ${SEMULA_AUTH_PROVIDERS:-}
      SEMULA_AUTH_GOOGLE_CLIENT_ID: ${SEMULA_AUTH_GOOGLE_CLIENT_ID:-}
      SEMULA_AUTH_GOOGLE_CLIENT_SECRET: ${SEMULA_AUTH_GOOGLE_CLIENT_SECRET:-}
      SEMULA_AUTH_GITHUB_CLIENT_ID: ${SEMULA_AUTH_GITHUB_CLIENT_ID:-}
      SEMULA_AUTH_GITHUB_CLIENT_SECRET: ${SEMULA_AUTH_GITHUB_CLIENT_SECRET:-}
    depends_on:
      migrate: {condition: service_completed_successfully}
    expose: ["8080"]
    mem_limit: 768m

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    <<: *hardening
    cap_add: [NET_BIND_SERVICE]
    networks:
      default:
        ipv4_address: 172.30.0.2 # fixed, so semula can trust this one address
    ports:
      - "${HTTP_PORT:-80}:80" # Let's Encrypt's challenge, and the redirect to https
      - "${HTTPS_PORT:-443}:443"
    environment:
      SEMULA_DOMAIN: ${SEMULA_DOMAIN:?set SEMULA_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certificates: losing this re-issues them, which is rate limited
      - caddy-config:/config
    depends_on:
      semula: {condition: service_healthy}
    mem_limit: 128m

  purge: # deletes workspaces whose 30 days of grace are over; once a day
    image: *image
    <<: *hardening
    restart: unless-stopped
    command: ["sh", "-c", "while true; do semula admin workspace-purge; sleep 86400; done"]
    healthcheck: # the image's own check asks a web server this one does not run
      test: ["CMD-SHELL", "kill -0 1"] # the loop's shell is alive
      interval: 30s
      timeout: 3s
      retries: 3
    environment:
      SEMULA_HOSTED: "on"
      <<: *owner_url
    depends_on:
      migrate: {condition: service_completed_successfully}
    mem_limit: 256m

  admin: # operator commands: docker compose run --rm admin workspace-create acme --name Acme
    image: *image
    <<: *hardening
    profiles: [tools]
    entrypoint: ["semula", "admin"]
    environment:
      SEMULA_HOSTED: "on"
      SEMULA_PUBLIC_URL: https://${SEMULA_DOMAIN:?set SEMULA_DOMAIN in .env}
      <<: *owner_url
    depends_on:
      migrate: {condition: service_completed_successfully}
    mem_limit: 256m

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24 # fixed, so Caddy can have a fixed address in it
          ip_range: 172.30.0.128/25 # everything else is handed out from here, never .2

volumes:
  pgdata:
  caddy-data:
  caddy-config:
