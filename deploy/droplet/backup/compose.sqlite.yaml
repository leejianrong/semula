# Nightly backups of the SQLite database in compose.sqlite.yaml. Add it with a second -f:
#
#   docker compose -f compose.sqlite.yaml -f backup/compose.sqlite.yaml up -d --wait
#
# Copies the live file with SQLite's backup API, so the app keeps running and the copy is whole.
# The dumps stay in the `backups` volume and, with the SEMULA_BACKUP_S3_* settings in .env, go
# to a bucket too. See "Backups" in docs/guide/upgrade-and-backup.md.
services:
  backup:
    build:
      context: ../..
      dockerfile: deploy/droplet/backup/Dockerfile
    image: semula-backup:local
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # root, but with only what it needs: read the live file and its write-ahead log, which the
    # semula user owns (DAC_OVERRIDE), and give a restored file back to that user (CHOWN)
    cap_add: [DAC_OVERRIDE, CHOWN]
    environment:
      SEMULA_DATA_DIR: /data
      SEMULA_RESTORE_OWNER: "10001:10001" # the semula image's user
      SEMULA_BACKUP_DIR: /backups
      SEMULA_BACKUP_KEEP_DAYS: ${SEMULA_BACKUP_KEEP_DAYS:-14}
      SEMULA_BACKUP_PASSPHRASE: ${SEMULA_BACKUP_PASSPHRASE:-}
      SEMULA_BACKUP_S3_ENDPOINT: ${SEMULA_BACKUP_S3_ENDPOINT:-}
      SEMULA_BACKUP_S3_REGION: ${SEMULA_BACKUP_S3_REGION:-}
      SEMULA_BACKUP_S3_BUCKET: ${SEMULA_BACKUP_S3_BUCKET:-}
      SEMULA_BACKUP_S3_PREFIX: ${SEMULA_BACKUP_S3_PREFIX:-semula/}
      SEMULA_BACKUP_S3_ACCESS_KEY: ${SEMULA_BACKUP_S3_ACCESS_KEY:-}
      SEMULA_BACKUP_S3_SECRET_KEY: ${SEMULA_BACKUP_S3_SECRET_KEY:-}
      SEMULA_BACKUP_PING_URL: ${SEMULA_BACKUP_PING_URL:-}
    volumes:
      - data:/data
      - backups:/backups
    # a backup now, then one a day at 02:30 UTC (a failed one is retried in five minutes)
    command:
      - sh
      - -c
      - |
        while true; do
          if semula-backup backup; then
            now=$$(date +%s); next=$$(( now / 86400 * 86400 + 9000 ))
            [ "$$next" -le "$$now" ] && next=$$(( next + 86400 ))
            sleep $$(( next - now ))
          else
            sleep 300  # a failed backup is tried again soon, not tomorrow
          fi
        done
    healthcheck: # unhealthy when the newest backup is over 30 hours old
      test: ["CMD", "semula-backup", "check", "--max-hours", "30"]
      interval: 10m
      timeout: 30s
      retries: 1
      start_period: 10m
    depends_on:
      migrate: {condition: service_completed_successfully} # the database file exists
    mem_limit: 128m

volumes:
  backups:
