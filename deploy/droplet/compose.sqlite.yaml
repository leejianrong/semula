# semula, hosted, on one small droplet with SQLite: Caddy (TLS) -> semula, plus a daily purge.
# The cheap way to start (a 1 GB droplet). Postgres is the way up: compose.yaml is the same
# stack with Postgres, and docs/guide/hosted.md says what SQLite costs.
#
#   cp .env.example .env && edit it          secrets and your domain (never commit .env)
#   docker compose -f compose.sqlite.yaml up -d --wait
#   docker compose -f compose.sqlite.yaml run --rm admin workspace-create acme --name Acme
#
# Only Caddy publishes ports (80 and 443). The database is one file in the `data` volume, shared by
# the app, the migrate step, the purge and `admin`: ONE app container only (SQLite has one writer,
# and the app keeps its event bus in memory, so a second replica would not hear the first).
# Row-level security is a Postgres feature, so here tenant isolation rests on the service's own
# workspace filter alone (ADR-0011).
name: semula-hosted

x-image: &image ${SEMULA_IMAGE:-ghcr.io/leejianrong/semula:latest-hosted}

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

x-data: &data
  volumes:
    - data:/data # semula.db and its write-ahead log; the image's user owns /data

services:
  migrate: # runs once per `up`, before the app; the app refuses to start on an old schema
    image: *image
    <<: [*hardening, *data]
    restart: "no"
    command: ["semula", "admin", "migrate"]
    environment:
      SEMULA_HOSTED: "on"
    mem_limit: 192m

  semula:
    image: *image
    restart: unless-stopped
    <<: [*hardening, *data]
    environment:
      SEMULA_HOSTED: "on"
      SEMULA_MIGRATE: "off"
      SEMULA_PUBLIC_URL: https://${SEMULA_DOMAIN:?set SEMULA_DOMAIN in .env}
      SEMULA_SECRET: ${SEMULA_SECRET:?set SEMULA_SECRET in .env}
      SEMULA_TRUSTED_PROXIES: 172.30.0.2 # Caddy's fixed address, and nothing else on the network
      SEMULA_AUTH_PROVIDERS: ${SEMULA_AUTH_PROVIDERS:-}
      SEMULA_AUTH_GOOGLE_CLIENT_ID: ${SEMULA_AUTH_GOOGLE_CLIENT_ID:-}
      SEMULA_AUTH_GOOGLE_CLIENT_SECRET: ${SEMULA_AUTH_GOOGLE_CLIENT_SECRET:-}
      SEMULA_AUTH_GITHUB_CLIENT_ID: ${SEMULA_AUTH_GITHUB_CLIENT_ID:-}
      SEMULA_AUTH_GITHUB_CLIENT_SECRET: ${SEMULA_AUTH_GITHUB_CLIENT_SECRET:-}
    depends_on:
      migrate: {condition: service_completed_successfully}
    expose: ["8080"]
    mem_limit: 512m

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    <<: *hardening
    cap_add: [NET_BIND_SERVICE]
    networks:
      default:
        ipv4_address: 172.30.0.2 # fixed, so semula can trust this one address
    ports:
      - "${HTTP_PORT:-80}:80" # Let's Encrypt's challenge, and the redirect to https
      - "${HTTPS_PORT:-443}:443"
    environment:
      SEMULA_DOMAIN: ${SEMULA_DOMAIN:?set SEMULA_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certificates: losing this re-issues them, which is rate limited
      - caddy-config:/config
    depends_on:
      semula: {condition: service_healthy}
    mem_limit: 96m

  purge: # deletes workspaces whose 30 days of grace are over; once a day
    image: *image
    <<: [*hardening, *data]
    restart: unless-stopped
    command: ["sh", "-c", "while true; do semula admin workspace-purge; sleep 86400; done"]
    healthcheck: # the image's own check asks a web server this one does not run
      test: ["CMD-SHELL", "kill -0 1"] # the loop's shell is alive
      interval: 30s
      timeout: 3s
      retries: 3
    environment:
      SEMULA_HOSTED: "on"
    depends_on:
      migrate: {condition: service_completed_successfully}
    mem_limit: 192m

  admin: # operator commands: docker compose -f compose.sqlite.yaml run --rm admin workspace-create ...
    image: *image
    <<: [*hardening, *data]
    profiles: [tools]
    entrypoint: ["semula", "admin"]
    environment:
      SEMULA_HOSTED: "on"
      SEMULA_PUBLIC_URL: https://${SEMULA_DOMAIN:?set SEMULA_DOMAIN in .env}
    depends_on:
      migrate: {condition: service_completed_successfully}
    mem_limit: 192m

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24 # fixed, so Caddy can have a fixed address in it
          ip_range: 172.30.0.128/25 # everything else is handed out from here, never .2

volumes:
  data:
  caddy-data:
  caddy-config:
