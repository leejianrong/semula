# The documentation site (https://leejianrong.github.io/semula/). Build: `make docs`.
[project]
site_name = "semula"
site_description = "A fake OpenAI-compatible server that learns its answers from your coding agent."
site_url = "https://leejianrong.github.io/semula/"
repo_url = "https://github.com/leejianrong/semula"
repo_name = "leejianrong/semula"
docs_dir = "docs"
site_dir = "site"
# The planning notes, design boards and chat logs stay in the repo and out of the site.
exclude_docs = """
PLAN.md
SLICES.md
QUESTIONS.md
E2E.md
INDAH-*.md
initial-chat.md
design/
indah/
adr/
RELEASING.md
"""
nav = [
  { "Home" = "index.md" },
  { "Concepts" = "concepts.md" },
  { "Tutorial" = [
    { "Your first recording" = "tutorial/first-recording.md" },
    { "Replay without a recorder" = "tutorial/replay.md" },
    { "Record with a coding agent" = "tutorial/agent.md" },
    { "Record a tool call and a stream" = "tutorial/tools-and-streaming.md" },
    { "Give each app its own project" = "tutorial/projects.md" },
    { "Edit and protect a recording" = "tutorial/editing.md" },
    { "Handle near misses" = "tutorial/near-misses.md" },
    { "Keep recordings in git" = "tutorial/cassettes.md" },
    { "Watch it in the dashboard" = "tutorial/dashboard.md" },
  ] },
  { "Guide" = [
    { "Install" = "guide/install.md" },
    { "Run it on your laptop" = "guide/service.md" },
    { "Record through a real model" = "guide/record-through.md" },
    { "Let a command answer" = "guide/answerer.md" },
    { "Manage a busy queue" = "guide/busy-queue.md" },
    { "Upgrade and back up" = "guide/upgrade-and-backup.md" },
    { "Host for a team" = "guide/hosted.md" },
  ] },
  { "Explanation" = [
    { "Why calls park" = "explanation/why-calls-park.md" },
    { "How matching works" = "explanation/how-matching-works.md" },
  ] },
  { "Reference" = [
    { "CLI" = "reference/cli.md" },
    { "MCP tools" = "reference/mcp.md" },
    { "REST API" = "reference/rest.md" },
    { "Configuration" = "reference/configuration.md" },
    { "Errors" = "reference/errors.md" },
  ] },
  { "For your agent" = ["agents/PLAYBOOK.md"] },
]

extra_css = ["assets/extra.css"]

[project.theme]
language = "en"
logo = "assets/logo.svg"
favicon = "assets/favicon.svg"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
