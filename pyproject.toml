[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semula"
version = "0.1.0"
description = "A record-replay fake LLM server: OpenAI-compatible, answered once by your coding agent, replayed for free."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jian Lee", email = "leejianrong2@gmail.com" }]
keywords = ["llm", "openai", "mock", "record-replay", "testing", "mcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
# Runtime dependencies are added by the slice that first needs them (ADR-0001).
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "jsonschema>=4.20",
    "fastmcp>=2.10",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "indah>=0.4,<0.5",
]

[project.scripts]
semula = "semula.cli:main"

[project.urls]
Homepage = "https://github.com/leejianrong/semula"
Repository = "https://github.com/leejianrong/semula"
Issues = "https://github.com/leejianrong/semula/issues"

[project.optional-dependencies]
# Hosted database (ADR-0009). SQLite needs nothing extra.
postgres = ["psycopg[binary]>=3.1"]
# Semantic matching (ADR-0003): adds ~180 MB plus a 65 MB model fetched once. Off by default.
embeddings = ["fastembed>=0.4"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "types-jsonschema",
    "psycopg[binary]>=3.1",
    "numpy>=1.26",  # the vector maths; fastembed itself is only in the `embeddings` extra
]
# Heavy client libraries for the e2e/conformance layer (kept out of the fast loop).
e2e = [
    "openai>=1.50",
    "langchain-openai>=0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/semula"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, isolated tests with no I/O beyond a temp dir",
    "integration: in-process app against a temp SQLite file; no network, no Docker",
    "e2e: the real container driven by real SDK clients (CI, needs Docker)",
    "embeddings: the real embedding model (needs the extra and a one-time download; own CI job)",
    "perf: latency budgets on a 1k-entry project (own CI job; `make bench` to print the table)",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
extend-exclude = ["examples"]  # runnable demos, not part of the package
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/semula"]

[[tool.mypy.overrides]]
module = ["fastembed", "fastembed.*", "loguru"]
ignore_missing_imports = true  # optional extra, not installed in the fast layer

[[tool.mypy.overrides]]
module = ["indah", "indah.*"]
ignore_missing_imports = true  # indah 0.4: check whether it ships py.typed
