<!doctype html>
<html lang="en">
<head>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
*,*:before,*:after{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
.app{display:flex;flex-wrap:wrap;min-height:900px;background:var(--md-sys-color-surface);color:var(--md-sys-color-on-surface);font:400 14px/20px 'Hanken Grotesk',system-ui,sans-serif;letter-spacing:.016em}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;line-height:16px;letter-spacing:0}
.sub{color:var(--md-sys-color-on-surface-variant)}
.hl{font:600 28px/36px 'Bricolage Grotesque',sans-serif;letter-spacing:-.01em;margin:0}
.lbs{font:500 12px/16px 'Hanken Grotesk',sans-serif;letter-spacing:.03em}
.sl{position:relative}
.sl:hover:before,.sl:focus-visible:before{content:'';position:absolute;inset:0;border-radius:inherit;background:currentColor;opacity:.08;pointer-events:none}
.sl:focus-visible{outline:2px solid var(--md-sys-color-primary);outline-offset:2px}
.rail{flex:1 0 256px;max-width:100%;background:var(--md-sys-color-surface-container);padding:12px;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;font:700 24px/28px 'Hanken Grotesk',sans-serif;letter-spacing:-.03em}
.proj{display:flex;align-items:center;gap:10px;height:40px;margin:4px 4px 10px;padding:0 14px 0 12px;border:1px solid var(--md-sys-color-outline);border-radius:20px;font:500 14px/20px 'Hanken Grotesk'}
.nv{display:flex;align-items:center;gap:12px;height:56px;padding:0 16px 0 18px;border-radius:28px;color:var(--md-sys-color-on-surface-variant);font:500 14px/20px 'Hanken Grotesk';letter-spacing:.006em}
.nv.on{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container);font-weight:600}
.cnt{margin-left:auto;min-width:22px;height:20px;padding:0 6px;border-radius:10px;background:var(--md-sys-color-record);color:var(--md-sys-color-on-record);font:600 12px/20px 'Hanken Grotesk';text-align:center}
.seg{display:flex;height:40px;border:1px solid var(--md-sys-color-outline);border-radius:20px;overflow:hidden;margin:auto 4px 4px}
.seg>button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font:500 14px/20px 'Hanken Grotesk';color:var(--md-sys-color-on-surface)}
.seg>button+button{border-left:1px solid var(--md-sys-color-outline)}
.seg>button.on{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container)}
.main{flex:999 1 600px;min-width:0;padding:24px 28px 28px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--md-sys-color-outline);border-radius:8px;font:500 14px/20px 'Hanken Grotesk';color:var(--md-sys-color-on-surface-variant)}
.chip.on{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container);border-color:transparent;padding-left:8px}
.ib{width:40px;height:40px;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;color:var(--md-sys-color-on-surface-variant)}
.card{background:var(--sem-panel);border:1px solid var(--md-sys-color-outline-variant);border-radius:12px}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 24px;border-radius:20px;font:500 14px/20px 'Hanken Grotesk';letter-spacing:.006em}
.btn.tonal{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container)}
.btn.text{padding:0 12px;color:var(--md-sys-color-primary)}
.search{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;border-radius:24px;background:var(--md-sys-color-surface-container-high);color:var(--md-sys-color-on-surface-variant);flex:1 1 280px;max-width:440px}
.row{display:grid;grid-template-columns:24px minmax(0,1fr) 64px 64px 96px;gap:16px;align-items:center;min-height:52px;padding:0 20px;border-top:1px solid var(--md-sys-color-outline-variant)}
.row.head{border-top:0;color:var(--md-sys-color-on-surface-variant);min-height:44px}
.row.sel{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container)}
.row.bulk{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container);border-top:0;min-height:56px;grid-template-columns:24px minmax(0,1fr) auto}
.cb{width:18px;height:18px;border-radius:2px;border:2px solid var(--md-sys-color-on-surface-variant);display:inline-flex;align-items:center;justify-content:center}
.cb.on{background:var(--md-sys-color-primary);border-color:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary)}
.flags{display:flex;gap:8px;color:var(--md-sys-color-on-surface-variant)}
.row.sel .flags{color:inherit}
.pn{color:var(--md-sys-color-primary)}
</style>
</helmet>
<div class="app" style="{{tv}}">
  <nav class="rail" aria-label="Main">
    <div class="logo"><svg viewBox="0 0 64 64" width="32" height="32" aria-hidden="true"><path d="M32 11A21 21 0 1 1 11 32" fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round"/><path d="M11 22L4 33H18z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="32" cy="11" r="8.5" style="fill:var(--md-sys-color-record)"/></svg>semula</div>

    <div class="seg" role="group" aria-label="Mode">
      <button class="on sl" type="button"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.500 8.500l3 3 6-7"/></svg>Replay</button>

    </div>
  </nav>

  <main class="main">
    <header class="top">
      <div style="display:flex;align-items:baseline;gap:12px"><h1 class="hl">Entries</h1><span class="sub tl" style="font-size:16px">1,284</span></div>

    </header>

    <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
      <label class="search"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.500"/><path d="M10.500 10.500L14 14"/></svg>Search</label>
      <button class="chip sl" type="button">Pinned</button>
      <button class="chip sl" type="button">Alias</button><button class="chip sl" type="button">Tool calls</button><button class="chip sl" type="button">Never hit</button>
    </div>

    <section class="card" style="overflow:hidden" aria-label="Entries">
      <div class="row bulk"><span class="cb on"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.500 8.500l3 3 6-7"/></svg></span><span class="lb" style="font:600 14px/20px 'Hanken Grotesk'">2 selected</span>
        <span style="display:flex;gap:4px"><button class="ib sl" type="button" aria-label="Pin" style="color:inherit"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.500 2l4.500 4.500-1.800.6-2.300 2.300.5 3.100-.9.900-2.900-2.900L3 13.500M9.500 2L6.400 5.100l-3.100-.5-.9.900 7 7"/></svg></button><button class="ib sl" type="button" aria-label="Delete" style="color:inherit"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.500h10M6.500 4.500V3h3v1.500M4.500 4.500l.5 8h6l.5-8"/></svg></button></span></div>
      <div class="row head lbs"><span></span><span>Prompt</span><span>Answers</span><span>Hits</span><span>Flags</span></div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
        <div class="{{r.cls}}">
          <span class="{{r.cb}}"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{r.tick}}"><path d="M3.500 8.500l3 3 6-7"/></svg></span>
          <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{r.prompt}}</span>
          <span class="m">{{r.answers}}</span>
          <span class="m">{{r.hits}}</span>
          <span class="flags"><sc-for list="{{r.flags}}" as="f"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="{{f.name}}"><path d="{{f.d}}"/></svg></sc-for></span>
        </div>
      </sc-for>
      <div style="display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:6px 12px;border-top:1px solid var(--md-sys-color-outline-variant)"><span class="sub" style="margin-right:12px">1–8 of 1,284</span><button class="ib sl" type="button" aria-label="Previous page"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3.500L5.500 8 10 12.500"/></svg></button><button class="ib sl" type="button" aria-label="Next page"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.500L10.500 8 6 12.500"/></svg></button></div>
    </section>
  </main>
</div>
</x-dc>
