<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>semula hosted sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
*,*:before,*:after{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
.app{display:flex;flex-wrap:wrap;gap:48px;align-items:center;justify-content:center;min-height:900px;padding:48px 32px;background:var(--md-sys-color-surface);color:var(--md-sys-color-on-surface);font:400 14px/20px 'Hanken Grotesk',system-ui,sans-serif;letter-spacing:.016em}
.sub{color:var(--md-sys-color-on-surface-variant)}
.sl{position:relative}
.sl:hover:before,.sl:focus-visible:before{content:'';position:absolute;inset:0;border-radius:inherit;background:currentColor;opacity:.08;pointer-events:none}
.sl:focus-visible{outline:2px solid var(--md-sys-color-primary);outline-offset:2px}
.logo{display:flex;align-items:center;gap:12px;font:700 32px/36px 'Hanken Grotesk',sans-serif;letter-spacing:-.03em}
.card{background:var(--sem-panel);border:1px solid var(--md-sys-color-outline-variant);border-radius:28px;padding:36px 32px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px}
.hl{font:600 28px/36px 'Bricolage Grotesque',sans-serif;letter-spacing:-.01em;margin:0}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:48px;padding:0 24px;border-radius:24px;font:500 14px/20px 'Hanken Grotesk';letter-spacing:.006em;width:100%}
.btn.filled{background:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary)}
.btn.outlined{border:1px solid var(--md-sys-color-outline)}
.fld{position:relative;display:flex;align-items:center;height:56px;padding:0 16px;border:1px solid var(--md-sys-color-outline);border-radius:4px}
.fld>label{position:absolute;top:-9px;left:12px;padding:0 4px;background:var(--sem-panel);font:400 12px/16px 'Hanken Grotesk';color:var(--md-sys-color-on-surface-variant)}
.or{display:flex;align-items:center;gap:12px;color:var(--md-sys-color-on-surface-variant)}
.or:before,.or:after{content:'';flex:1;height:1px;background:var(--md-sys-color-outline-variant)}
.new{outline:2px dashed var(--md-sys-color-tertiary);outline-offset:6px}
.menu{background:var(--md-sys-color-surface-container);border-radius:12px;overflow:hidden;padding:8px 0;width:100%;max-width:360px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.mi{display:flex;align-items:center;gap:16px;min-height:56px;padding:0 16px}
.mi.cur{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container)}
.av{width:32px;height:32px;border-radius:16px;background:var(--md-sys-color-tertiary-container);color:var(--md-sys-color-on-tertiary-container);display:inline-flex;align-items:center;justify-content:center;font:600 14px/20px 'Hanken Grotesk';flex:none}
.out{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:8px;font:500 12px/16px 'Hanken Grotesk';letter-spacing:.03em;border:1px solid var(--md-sys-color-outline-variant);color:var(--md-sys-color-on-surface-variant)}
.divider{height:1px;background:var(--md-sys-color-outline-variant);margin:8px 0}
.text{color:var(--md-sys-color-primary);font:500 14px/20px 'Hanken Grotesk';padding:8px 12px;border-radius:20px}
</style>
</helmet>
<div class="app" style="{{tv}}">
  <section class="card new" aria-label="Sign in">
    <div class="logo"><svg viewBox="0 0 64 64" width="40" height="40" aria-hidden="true"><path d="M32 11A21 21 0 1 1 11 32" fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round"/><path d="M11 22L4 33H18z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="32" cy="11" r="8.5" style="fill:var(--md-sys-color-record)"/></svg>semula</div>
    <h1 class="hl" style="margin-top:8px">Sign in</h1>
    <a class="btn outlined sl" href="#"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="4" r="1.600"/><circle cx="5" cy="12" r="1.600"/><circle cx="11" cy="7" r="1.600"/><path d="M5 5.600v4.800M5 9c0-2 6-.500 6-2"/></svg>Continue with GitHub</a>
    <a class="btn outlined sl" href="#"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 2v12M2 8h12"/></svg>Continue with Google</a>
    <div class="or">or</div>
    <div class="fld"><label>Work email</label><span class="sub">you@company.com</span></div>
    <a class="btn filled sl" href="#">Continue with SSO</a>
    <div class="sub" style="text-align:center">Invitation only</div>
  </section>

  <section class="menu new" aria-label="Workspaces">
    <sc-for list="{{spaces}}" as="w" hint-placeholder-count="3">
      <div class="{{w.cls}}"><span class="av">{{w.i}}</span><span style="flex:1;min-width:0">{{w.name}}</span><span class="out">{{w.role}}</span></div>
    </sc-for>
    <div class="divider"></div>
    <div class="mi"><span class="av" style="background:var(--md-sys-color-surface-container-highest);color:var(--md-sys-color-on-surface)">P</span><span style="flex:1;min-width:0">Platform team</span><a class="text sl" href="#">Accept</a></div>
    <div class="mi sub"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" style="margin:0 6px"><path d="M8 3v10M3 8h10"/></svg>Create workspace</div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1360,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      light: {"primary":"#256A59","on-primary":"#E4FFF4","secondary-container":"#CDE9DE","on-secondary-container":"#3E574F","tertiary":"#306673","tertiary-container":"#B2E8F8","on-tertiary-container":"#1E5764","surface":"#F6FAF7","on-surface":"#2A3531","on-surface-variant":"#57615D","surface-container-lowest":"#FFFFFF","surface-container-low":"#EFF5F1","surface-container":"#E8F0EB","surface-container-highest":"#DAE5DF","outline":"#727D78","outline-variant":"#A9B4AF","record":"#C8271F"},
      dark: {"primary":"#9ED1C0","on-primary":"#15483C","secondary-container":"#284039","on-secondary-container":"#ABC5BB","tertiary":"#CFF4FF","tertiary-container":"#1E5764","on-tertiary-container":"#B2E8F8","surface":"#0A0F0D","on-surface":"#DDE8E2","on-surface-variant":"#A3AEA8","surface-container-lowest":"#000000","surface-container-low":"#0E1512","surface-container":"#141B19","surface-container-highest":"#1E2824","outline":"#6D7873","outline-variant":"#404A46","record":"#FF7767"},
    };
    const dark = this.props.theme === 'dark';
    const t = Object.assign({}, dark ? T.dark : T.light);
    const vars = Object.entries(t).map(([k, v]) => '--md-sys-color-' + k + ':' + v);
    vars.push('--sem-panel:' + (dark ? t['surface-container-low'] : t['surface-container-lowest']));
    const spaces = [
      { cls: 'mi cur', i: 'A', name: 'Acme QA', role: 'Admin' },
      { cls: 'mi', i: 'P', name: 'Personal', role: 'Admin' },
      { cls: 'mi', i: 'F', name: 'Payments squad', role: 'Viewer' },
    ];
    return { tv: vars.join(';'), spaces };
  }
}
</script>
</body>
</html>
